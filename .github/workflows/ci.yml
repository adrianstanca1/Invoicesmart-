name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit (production deps only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Verify production bundle uses same-origin LLM endpoint
        run: |
          shopt -s nullglob
          BUNDLES=(dist/assets/*.js)
          if [ ${#BUNDLES[@]} -eq 0 ]; then
            echo "::error::No built JS bundles found in dist/assets/"
            exit 1
          fi
          # The same-origin default endpoint must be present.
          if ! grep -ql '/ollama' "${BUNDLES[@]}"; then
            echo "::error::Production bundle is missing the /ollama same-origin default"
            exit 1
          fi
          # Allow 'localhost:11434' ONLY as a UI placeholder (e.g. input placeholder text).
          # Flag it only when used as an active http(s) endpoint assignment/default.
          if grep -qlE 'https?://localhost:11434' "${BUNDLES[@]}"; then
            # exclude the known Settings placeholder usage
            if grep -qlE '(apiEndpoint|baseUrl|endpoint|OLLAMA|apiUrl)\s*[:=]\s*["'\'']https?://localhost:11434' "${BUNDLES[@]}"; then
              echo "::error::Production bundle hardcodes http://localhost:11434 as an active LLM endpoint"
              exit 1
            fi
          fi
          echo "OK: prod bundle defaults to /ollama"

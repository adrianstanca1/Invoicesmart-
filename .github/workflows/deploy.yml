name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.VPS_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync dist/ to VPS
        run: |
          rsync -avz --delete \
            --exclude '.well-known' \
            dist/ deploy@${{ secrets.VPS_HOST }}:/var/www/invoicesmart/

      - name: Reload nginx
        run: |
          ssh deploy@${{ secrets.VPS_HOST }} 'sudo /usr/sbin/nginx -t && sudo /bin/systemctl reload nginx'

      - name: Smoke test
        run: |
          curl -fsS --retry 3 "https://${{ vars.VPS_DOMAIN }}/" -o /dev/null
          curl -fsS --retry 3 "https://${{ vars.VPS_DOMAIN }}/ollama/api/tags" -o /dev/null
